name: Build OpenWrt
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      invalidate-cache:
        description: "Invalidate cache (force Docker image rebuild)"
        type: boolean
        default: false
      invalidate-toolchain-cache:
        description: "Invalidate toolchain cache (force tools/toolchain rebuild)"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

env:
  COLOR_GREEN: '\033[0;32m'
  COLOR_YELLOW: '\033[0;33m'
  COLOR_RESET: '\033[0m'
  ICON_HIT: "\u2705"
  ICON_MISS: "\u23F3"

jobs:
  gather-info:
    name: Gather info for caching
    runs-on: ubuntu-latest
    outputs:
      cache-image: ${{ steps.hash.outputs.cache-image }}
      toolchain-image: ${{ steps.hash.outputs.toolchain-image }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Compute cache hashes
        id: hash
        run: |
          hash=$(cat modules Dockerfile Makefile | sha256sum | cut -d ' ' -f 1)
          CACHE_IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:cache-${hash}"
          TOOLCHAIN_IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:toolchain-neoplus2-$(uname -m)-${hash}"
          echo "cache-image=$CACHE_IMAGE" >> "$GITHUB_OUTPUT"
          echo "toolchain-image=$TOOLCHAIN_IMAGE" >> "$GITHUB_OUTPUT"

  build-docker:
    name: Build Docker image if necessary (and cache it)
    needs: gather-info
    runs-on: ubuntu-latest
    outputs:
      local-image: ${{ steps.docker.outputs.local-image }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Pull cached Docker image or build
        id: docker
        env:
          CACHE_IMAGE: ${{ needs.gather-info.outputs.cache-image }}
          INVALIDATE_CACHE: ${{ inputs.invalidate-cache == true }}
        run: |
          LOCAL_IMAGE="$(BASE_SCRIPTS_DIR=./scripts/;. scripts/common.sh; echo $image_name)"
          echo "local-image=$LOCAL_IMAGE" >> "$GITHUB_OUTPUT"

          if [ "$INVALIDATE_CACHE" != "true" ] && docker pull "$CACHE_IMAGE"; then
            echo -e "${ICON_HIT}${COLOR_GREEN} Cache hit - using cached Docker image${COLOR_RESET}"
          else
            echo -e "${ICON_MISS}${COLOR_YELLOW} Cache miss - building Docker image${COLOR_RESET}"
            make ci-docker-build

            docker tag "$LOCAL_IMAGE" "$CACHE_IMAGE"
            docker push "$CACHE_IMAGE"
          fi

  build-toolchain:
    name: Build toolchain if necessary (and cache it)
    needs: [gather-info, build-docker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Pull cached toolchain image or build
        env:
          DOCKER_CACHE_IMAGE: ${{ needs.gather-info.outputs.cache-image }}
          TOOLCHAIN_IMAGE: ${{ needs.gather-info.outputs.toolchain-image }}
          LOCAL_IMAGE: ${{ needs.build-docker.outputs.local-image }}
          INVALIDATE_CACHE: ${{ inputs.invalidate-toolchain-cache == true }}
        run: |
          if [ "$INVALIDATE_CACHE" != "true" ] && docker pull "$TOOLCHAIN_IMAGE"; then
            echo -e "${ICON_HIT}${COLOR_GREEN} Cache hit - using cached toolchain image${COLOR_RESET}"
          else
            echo -e "${ICON_MISS}${COLOR_YELLOW} Cache miss - building toolchain${COLOR_RESET}"

            # Pull the base Docker image and tag locally
            docker pull "$DOCKER_CACHE_IMAGE"
            docker tag "$DOCKER_CACHE_IMAGE" "$LOCAL_IMAGE"

            # Run container without volume (required for docker commit)
            make ci-docker-run-no-vol
            make ci-patch-neoplus2
            make ci-toolchain

            # Commit container state and push as toolchain cache
            make ci-toolchain-commit CI_TOOLCHAIN_IMAGE="$TOOLCHAIN_IMAGE"
            docker push "$TOOLCHAIN_IMAGE"
          fi

  build-openwrt:
    name: Build OpenWrt
    needs: [gather-info, build-docker, build-toolchain]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Pull toolchain image
        env:
          TOOLCHAIN_IMAGE: ${{ needs.gather-info.outputs.toolchain-image }}
          LOCAL_IMAGE: ${{ needs.build-docker.outputs.local-image }}
        run: |
          docker pull "$TOOLCHAIN_IMAGE"
          docker tag "$TOOLCHAIN_IMAGE" "$LOCAL_IMAGE"
      - name: Start Docker container
        run: make ci-docker-run
      - name: Reset OpenWrt to base commit
        run: make ci-reset-openwrt
      - name: Add NeoPlus2 patches
        run: make ci-patch-neoplus2
      - name: Build OpenWrt
        run: make ci-compile
      - name: Copy output files
        run: make ci-copy
      - name: Upload output files
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: "openwrt-bin-output"
          path: "./bin"
