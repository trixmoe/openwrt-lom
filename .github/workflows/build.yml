name: Build OpenWrt
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      invalidate-cache:
        description: "Invalidate cache (force full image rebuild)"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

env:
  COLOR_GREEN: '\033[0;32m'
  COLOR_YELLOW: '\033[0;33m'
  COLOR_RESET: '\033[0m'
  ICON_HIT: "\u2705"
  ICON_MISS: "\u23F3"

jobs:
  build-image:
    name: Build toolchain image (and cache it)
    runs-on: ubuntu-latest
    outputs:
      cache-image: ${{ steps.build.outputs.cache-image }}
      local-image: ${{ steps.build.outputs.local-image }}
    steps:
      - name: Free disk space
        run: curl -fsSL https://raw.githubusercontent.com/kou/arrow/e49d8ae15583ceff03237571569099a6ad62be32/ci/scripts/util_free_space.sh | bash
      - name: Free more disk space
        run: |
          df -h
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /opt/pipx
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/share/swift
          sudo rm -rf /opt/hostedtoolcache
          df -h
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install moreutils (ts for build timestamps)
        run: sudo apt-get install -y moreutils
      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Pull cached image or build
        id: build
        env:
          INVALIDATE_CACHE: ${{ inputs.invalidate-cache == true }}
        run: |
          hash=$({ cat modules Dockerfile Makefile; find scripts -type f | sort | xargs cat; } | sha256sum | cut -d ' ' -f 1)
          CACHE_IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:toolchain-${hash}"
          LOCAL_IMAGE="$(BASE_SCRIPTS_DIR=./scripts/;. scripts/common.sh; echo $image_name)"
          echo "cache-image=$CACHE_IMAGE" >> "$GITHUB_OUTPUT"
          echo "local-image=$LOCAL_IMAGE" >> "$GITHUB_OUTPUT"

          if [ "$INVALIDATE_CACHE" != "true" ] && skopeo inspect "docker://$CACHE_IMAGE" > /dev/null 2>&1; then
            echo -e "${ICON_HIT}${COLOR_GREEN} Cache hit - image exists in registry${COLOR_RESET}"
          else
            echo -e "${ICON_MISS}${COLOR_YELLOW} Cache miss - building image${COLOR_RESET}"
            make ci-build

            podman tag "$LOCAL_IMAGE" "$CACHE_IMAGE"
            podman push "$CACHE_IMAGE"
          fi

  build-openwrt:
    name: Build OpenWrt
    needs: build-image
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: curl -fsSL https://raw.githubusercontent.com/kou/arrow/e49d8ae15583ceff03237571569099a6ad62be32/ci/scripts/util_free_space.sh | bash
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Pull toolchain image
        env:
          CACHE_IMAGE: ${{ needs.build-image.outputs.cache-image }}
          LOCAL_IMAGE: ${{ needs.build-image.outputs.local-image }}
        run: |
          podman pull "$CACHE_IMAGE"
          podman tag "$CACHE_IMAGE" "$LOCAL_IMAGE"
      - name: Start container
        run: make ci-run
      - name: Reset OpenWrt to base commit
        run: make ci-reset-openwrt
      - name: Add NeoPlus2 patches
        run: make ci-patch-neoplus2
      - name: Build OpenWrt
        run: make ci-compile
      - name: Copy output files
        run: make ci-copy
      - name: Upload output files
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: "openwrt-bin-output"
          path: "./bin"
